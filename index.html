<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1a1d23; --sub:#5a6270; --line:#e2e5ea;
  --accent:#2f6fed; --accent2:#0f9d58; --warn:#e0592a; --danger:#d64545;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15171c;--card:#1e2128;--ink:#eef0f3;--sub:#a3aab6;--line:#30343c;}
}
:root[data-theme="dark"]{--bg:#15171c;--card:#1e2128;--ink:#eef0f3;--sub:#a3aab6;--line:#30343c;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;padding-top:calc(16px + env(safe-area-inset-top,0px));z-index:5;}
header h1{margin:0;font-size:18px;}
header p{margin:2px 0 0;color:var(--sub);font-size:13px;}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);}
nav button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
main{max-width:1100px;margin:0 auto;padding:18px 20px 60px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
.card h2{margin:0 0 10px;font-size:15px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
input[type=text],input[type=number],select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:16px;min-height:38px;}
button.btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:9px 14px;font-size:14px;cursor:pointer;min-height:38px;}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px;}
table.grid{width:auto;border-collapse:collapse;}
.edt-sheet{--bg:#f4f5f7;--card:#fff;--ink:#1a1d23;--sub:#5a6270;--line:#d5d9e0;--accent:#2f6fed;background:#fff;color:#1a1d23;padding:14px;border:1px solid #d5d9e0;border-radius:10px;}
.edt-sheet .gridwrap{margin:0;padding:0;}
.edt-sheet .cell.busy{background:#eaf1ff !important;}
.edt-sheet .sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-weight:700;font-size:15px;}
.edt-sheet .sh-title{text-align:center;font-weight:800;font-size:16px;margin:6px 0 10px;letter-spacing:.5px;}
.edt-sheet .sh-info{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;font-size:13px;line-height:1.6;}
.edt-sheet .sh-info img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid #d5d9e0;flex-shrink:0;}
.edt-sheet table.recap{width:100%;border-collapse:collapse;font-size:12px;}
.edt-sheet table.recap th,.edt-sheet table.recap td{border:1px solid #d5d9e0;padding:5px 7px;text-align:left;}
.edt-sheet table.recap th{background:#f4f5f7;}
.modal.wide{max-width:760px;}
.aide details{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--bg);}
.aide summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:14px;list-style:none;}
.aide summary::-webkit-details-marker{display:none;}
.aide summary::before{content:'▸ ';color:var(--accent);}
.aide details[open] summary::before{content:'▾ ';}
.aide .aide-body{padding:0 14px 12px;font-size:13px;line-height:1.6;color:var(--ink);}
.aide .aide-body b{color:var(--accent);}
.aide .aide-body ul{margin:6px 0;padding-left:20px;}
.aide .aide-body li{margin-bottom:4px;}
.cell.ko{opacity:.35;}
.dispo-edit .cell.ok{background:#e6f6ec;}
.dispo-edit .cell.ko{background:#ddd;opacity:.75;}
.edt-sheet .sh-foot{display:none;margin-top:12px;font-size:11px;text-align:right;color:#5a6270;}
.edt-sheet.capturing .sh-foot{display:block;}
.edt-sheet, .edt-sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
#printArea{display:none;}
@media print{
  @page{size:A4 portrait;margin:10mm;}
  body.printing > *:not(#printArea){display:none !important;}
  body.printing #printArea{display:block !important;}
  body.printing{background:#fff !important;padding:0 !important;}
  #printArea .edt-sheet{border:none;padding:0;width:100%;}
  #printArea .gridwrap{overflow:visible !important;}
  #printArea .edt-sheet .cell{height:40px;min-width:0;font-size:10px;}
  #printArea .edt-sheet table.recap{font-size:11px;}
  #printArea .edt-sheet tr{page-break-inside:avoid;}
  #printArea .edt-sheet .sh-foot{display:block;}
}
button.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
button.btn.danger{background:var(--danger);}
button.btn.small{padding:4px 8px;font-size:12px;}
ul.tags{list-style:none;padding:0;margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;}
ul.tags li{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12px;display:flex;gap:6px;align-items:center;}
ul.tags li button{border:none;background:none;color:var(--danger);cursor:pointer;font-weight:bold;}
table{border-collapse:collapse;width:100%;font-size:12px;}
table.grid td,table.grid th{border:1px solid var(--line);padding:0;text-align:center;}
table.grid th{background:var(--bg);padding:6px 4px;font-weight:600;}
table.grid td.slot{background:var(--bg);padding:6px;font-weight:600;white-space:nowrap;}
.cell{min-width:90px;height:52px;padding:3px;cursor:pointer;font-size:11px;line-height:1.3;}
.cell:hover{outline:2px solid var(--accent);outline-offset:-2px;}
.cell.busy{background:#eaf1ff;}
:root[data-theme="dark"] .cell.busy, @media (prefers-color-scheme:dark){.cell.busy{background:#1f2a44;}}
.cell b{display:block;color:var(--accent);}
.small{font-size:12px;color:var(--sub);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;}
.overlay.show{display:flex;}
.modal{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:380px;max-height:85vh;overflow:auto;}
.modal h3{margin-top:0;font-size:15px;}
.modal label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px;}
.modal select,.modal input{width:100%;}
.availgrid{display:grid;gap:3px;font-size:10px;min-width:520px;}
.availgrid .h{font-weight:600;text-align:center;padding:3px;}
.availchk{width:100%;height:32px;border-radius:4px;border:1px solid var(--line);cursor:pointer;background:var(--bg);}
.availchk.on{background:var(--accent2);border-color:var(--accent2);}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;background:var(--bg);border:1px solid var(--line);margin-left:6px;}
.msg{font-size:12px;padding:8px 10px;border-radius:8px;margin-top:8px;}
.msg.ok{background:#e6f6ec;color:#0f9d58;}
.msg.err{background:#fdeceb;color:#d64545;}

function save(){ try{ localStorage.setItem('edt_v1', JSON.stringify(state)); localStorage.setItem('edt_v1_ts', String(Date.now())); }catch(e){} scheduleCloudSave(); }
let fbSaveTimer=null;
function scheduleCloudSave(){
  if(!fbReady || fbApplyingRemote) return;
  clearTimeout(fbSaveTimer);
  fbSaveTimer=setTimeout(()=>{
    fbDb.collection('edt').doc('etat').set({
      data: JSON.stringify(state),
      maj: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{ setSyncStatus('ok'); }).catch(e=>{ console.warn('Sauvegarde en ligne échouée', e); setSyncStatus('erreur'); });
  }, 900);
}
function setSyncStatus(s){
  const el=document.getElementById('syncStatus'); if(!el) return;
  if(s==='ok') el.textContent='☁️ Synchronisé';
  else if(s==='cours') el.textContent='☁️ Synchronisation…';
  else if(s==='erreur') el.textContent='⚠️ Synchro impossible (hors ligne ?)';
  else el.textContent='💾 Local uniquement';
}
function load(){ try{ const r=localStorage.getItem('edt_v1'); return r?JSON.parse(r):null; }catch(e){ return null; } }

];
if(!state.donnees){
  const a = state.anneeActuelle || DEFAULT_ANNEE;
  state.donnees = { [a]: { classes: state.classes||{}, classeFiliere: state.classeFiliere||{}, besoins: state.besoins||[], emploi: state.emploi||{} } };
  state.annees = [a]; state.anneeActuelle = a;
  delete state.classes; delete state.classeFiliere; delete state.besoins; delete state.emploi;
}
if(!state.annees) state.annees=[state.anneeActuelle||DEFAULT_ANNEE];
if(!state.anneeActuelle) state.anneeActuelle = state.annees[0];
function cd(){
  const a = state.anneeActuelle;
  if(!state.donnees[a]) state.donnees[a] = {classes:{}, classeFiliere:{}, besoins:[], emploi:{}};
  const d = state.donnees[a];
  state.ecoles.forEach(e=>{
    if(!d.classes[e.id]) d.classes[e.id]=[];
    if(!d.emploi[e.id]) d.emploi[e.id]={};
    if(!state.salles[e.id]) state.salles[e.id]=[];
  });
  return d;
}

// ---------- HELPERS ----------
function ecoleNom(id){ return state.ecoles.find(s=>s.id===id)?.nom || id; }
function profBusy(profId, jour, cren, excludeEcole, excludeClasse){
  for(const s of state.ecoles){
    const e = cd().emploi[s.id]||{};
    for(const cl in e){
      const v = e[cl][jour+'|'+cren];
      if(v && v.profId===profId){
        if(s.id===excludeEcole && cl===excludeClasse) continue;
        return {ecole:s.id, classe:cl};
      }
    }
  }
  return null;
}
function salleBusy(ecole, salle, jour, cren, excludeClasse){
  const e = cd().emploi[ecole]||{};
  for(const cl in e){
    if(cl===excludeClasse) continue;
    const v = e[cl][jour+'|'+cren];
    if(v && v.salle===salle) return cl;
  }
  return null;
}
function nomsSalles(ecole){ return (state.salles[ecole]||[]).map(s=>s.nom); }
function toutesMatieres(extra){
  const s=new Set([...state.matieres, ...state.filieres.flatMap(f=>f.matieres.map(m=>m.nom)), ...(extra||[])]);
  return [...s].sort((a,b)=>a.localeCompare(b));
}

function renderAnneeBar(){
  const bar=document.getElementById('anneeBar');
  bar.innerHTML='';
  const lbl=document.createElement('b'); lbl.textContent='Année scolaire :'; lbl.style.fontSize='13px';
  const sel=document.createElement('select');
  state.annees.forEach(a=>{ const o=document.createElement('option'); o.value=a; o.textContent=a; if(a===state.anneeActuelle) o.selected=true; sel.appendChild(o); });
  sel.onchange=()=>{ state.anneeActuelle=sel.value; cd(); save(); renderMain(); };
  const bNew=document.createElement('button'); bNew.className='btn small'; bNew.textContent='+ Nouvelle année';
  bNew.onclick=()=>{
    const nom = prompt("Nom de la nouvelle année scolaire (ex: 2026-2027)");
    if(!nom) return;
    if(state.annees.includes(nom)){ alert('Cette année existe déjà.'); return; }
    const dupliquer = confirm("Dupliquer les classes (et leur filière) de l'année "+state.anneeActuelle+" vers "+nom+" ?\n(Les emplois du temps et besoins horaires repartiront de zéro dans tous les cas.)");
    const resetDispo = confirm("Réinitialiser aussi les disponibilités de tous les professeurs pour cette nouvelle année ?\n(Utile si les dispos changent à la rentrée. Les emplois du temps déjà construits sur les anciennes années ne sont pas affectés.)");
    const source = cd();
    const nouvelle = {classes:{}, classeFiliere:{}, besoins:[], emploi:{}};
    state.ecoles.forEach(e=>{
      nouvelle.classes[e.id] = dupliquer ? [...(source.classes[e.id]||[])] : [];
      nouvelle.emploi[e.id] = {};
    });
    if(dupliquer){ Object.keys(source.classeFiliere).forEach(k=>{ nouvelle.classeFiliere[k]=source.classeFiliere[k]; }); }
    if(resetDispo){ state.profs.forEach(p=>{ p.dispo = {}; }); }
    state.donnees[nom]=nouvelle;
    state.annees.push(nom);
    state.anneeActuelle=nom;
    save(); renderTabs(); renderAnneeBar(); renderMain();
  };
  bar.append(lbl, sel, bNew);
}

function tagList(items, onDel){
  const ul = document.createElement('ul'); ul.className='tags';
  items.forEach((it,i)=>{
    const li=document.createElement('li');
    li.innerHTML = `<span>${it}</span>`;
    const b=document.createElement('button'); b.textContent='✕';
    b.onclick=()=>onDel(i);
    li.appendChild(b); ul.appendChild(li);
  });
  return ul;
}

    <div class="row"><button class="btn" id="fSave">Enregistrer la filière</button></div>
    <div id="fMsg"></div>`;
  app.appendChild(c);
  const lignes=[];
  const matDiv=c.querySelector('#fMatieres');
  function addLigne(nom='', heures=''){
    const row=document.createElement('div'); row.className='row';
    const inpN=document.createElement('input'); inpN.type='text'; inpN.placeholder='Matière'; inpN.value=nom; inpN.style.flex='2';
    const inpH=document.createElement('input'); inpH.type='number'; inpH.placeholder='h/sem'; inpH.value=heures; inpH.style.width='70px';
    inpH.oninput=updateTotal;
    const del=document.createElement('button'); del.className='btn danger small'; del.textContent='✕';
    del.onclick=()=>{ row.remove(); updateTotal(); };
    row.append(inpN, inpH, del);
    matDiv.appendChild(row);
    updateTotal();
  }
  function updateTotal(){
    let t=0;
    matDiv.querySelectorAll('input[type=number]').forEach(i=>{ t+=parseInt(i.value)||0; });
    c.querySelector('#fTotal').textContent=t;
  }
  c.querySelector('#fAddLigne').onclick=()=>addLigne();
  addLigne(); addLigne();
  c.querySelector('#fSave').onclick=()=>{
    const code = c.querySelector('#fCode').value.trim();
    const rows=[...matDiv.children];

      const ins=r.querySelectorAll('input');
      return {nom: ins[0].value.trim(), heures: parseInt(ins[1].value)||0};
    }).filter(m=>m.nom);
    const msg=c.querySelector('#fMsg');
    if(!code || matieres.length===0){ msg.innerHTML='<div class="msg err">Code et au moins une matière requis.</div>'; return; }

  };

  if(state.filieres.length===0) list.innerHTML+='<p class="small">Aucune filière pour le moment.</p>';
  state.filieres.forEach(f=>{
    const total = f.matieres.reduce((s,m)=>s+m.heures,0);
    const div=document.createElement('div'); div.style.borderTop='1px solid var(--line)'; div.style.padding='10px 0';
    div.innerHTML = `<b>${f.code}</b> — ${f.matieres.length} matières, ${total}h/semaine
      <br><span class="small">${f.matieres.map(m=>m.nom+' ('+m.heures+'h)').join(', ')}</span>`;
    const bDel=document.createElement('button'); bDel.className='btn danger small'; bDel.textContent='Supprimer'; bDel.style.marginTop='6px';
    bDel.onclick=()=>{ state.filieres = state.filieres.filter(x=>x.id!==f.id); save(); renderMain(); };
    div.appendChild(bDel);
    list.appendChild(div);
  });
  app.appendChild(list);
}

  const imp=document.createElement('div'); imp.className='card';
  imp.innerHTML=`<h2>Importer une liste depuis Excel</h2>
    <p class="small">Détection automatique des colonnes : une colonne contenant "Nom" (ex: "Noms et prénoms") et une contenant "Matière" sont repérées automatiquement, même avec un titre au-dessus du tableau. Colonnes "École" et "Téléphone"/"Contact" optionnelles. Plusieurs matières pour un même prof : sépare-les par virgule, point-virgule ou "/".</p>
    <div class="row"><input type="file" id="impFile" accept=".xlsx,.xls"></div>
    <div id="impMsg"></div>`;
  app.appendChild(imp);
  setTimeout(()=>{
    const inp = imp.querySelector('#impFile');
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = (e)=>{
        try{
          const wb = XLSX.read(e.target.result, {type:'binary'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
          // Détection automatique de la ligne d'en-tête (contient un mot "NOM" et un mot "MATIERE")
          let headerRow=-1, colNom=-1, colMatiere=-1, colEcole=-1, colTel=-1;
          for(let r=0; r<Math.min(raw.length,15); r++){
            const row = raw[r].map(c=>String(c).toUpperCase());
            const iNom = row.findIndex(c=>c.includes('NOM'));
            const iMat = row.findIndex(c=>c.includes('MATIERE'));
            if(iNom>=0 && iMat>=0){ headerRow=r; colNom=iNom; colMatiere=iMat;
              colEcole = row.findIndex(c=>c.includes('ECOLE'));
              colTel = row.findIndex(c=>c.includes('TEL') || c.includes('CONTACT'));
              break;
            }
          }
          if(headerRow===-1){
            imp.querySelector('#impMsg').innerHTML = `<div class="msg err">Colonnes non reconnues : je n'ai pas trouvé de colonne contenant "NOM" et une autre contenant "MATIERE". Vérifie les en-têtes du fichier.</div>`;
            return;
          }
          let count=0, matieresAjoutees=0;
          for(let r=headerRow+1; r<raw.length; r++){
            const row = raw[r];
            if(!row || !row.length) continue;
            const nom = String(row[colNom]||'').trim();
            if(!nom) continue;
            const matRaw = String(row[colMatiere]||'').trim();
            const matieres = matRaw.split(/[,;\/]/).map(s=>s.trim()).filter(Boolean);
            matieres.forEach(m=>{ if(m && !state.matieres.includes(m)){ state.matieres.push(m); matieresAjoutees++; } });
            const ecolesNoms = colEcole>=0 ? String(row[colEcole]||'').split(/[,;\/]/).map(s=>s.trim()).filter(Boolean) : [];
            const ecoles = state.ecoles.filter(e=>ecolesNoms.some(n=>n.toLowerCase()===e.nom.toLowerCase())).map(e=>e.id);
            const telephone = colTel>=0 ? String(row[colTel]||'').trim() : '';
            state.profs.push({id:uid(), nom, age:null, lieuNaissance:'', telephone, photo:null, diplome:'', matieres, ecoles, dispo:toutesDispoParDefaut()});
            count++;
          }
          save();
          imp.querySelector('#impMsg').innerHTML = `<div class="msg ok">${count} professeur(s) importé(s)${matieresAjoutees?` — ${matieresAjoutees} nouvelle(s) matière(s) ajoutée(s) à la liste globale`:''}.${colEcole<0?' Aucune colonne "École" détectée : pense à assigner les écoles manuellement pour chaque prof.':''} Pense aussi à cocher leurs disponibilités.</div>`;
          setTimeout(()=>renderMain(),800);
        }catch(err){
          imp.querySelector('#impMsg').innerHTML = `<div class="msg err">Erreur de lecture du fichier : ${err.message}</div>`;
        }
      };
      reader.readAsBinaryString(f);
    };
  },0);

  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<h2>Ajouter un professeur manuellement</h2>`;
  if(state.jours.length===0){
    c.innerHTML+=`<p class="small">Ajoute d'abord au moins un jour dans l'onglet Configuration.</p>`;
    app.appendChild(c); return;
  }
  c.appendChild(buildProfForm());
  app.appendChild(c);

  const list=document.createElement('div'); list.className='card';
  list.innerHTML='<h2>Professeurs ('+state.profs.length+')</h2>';
  const tools=document.createElement('div'); tools.className='row';
  const search=document.createElement('input'); search.type='text'; search.placeholder='Rechercher (nom ou matière)…'; search.style.flex='1'; search.style.minWidth='200px'; search.value=profSearch;
  const bOpen=document.createElement('button'); bOpen.className='btn ghost small'; bOpen.textContent="Ouvrir les disponibilités des profs qui n'en ont aucune";
  bOpen.onclick=()=>{
    const cibles=state.profs.filter(p=>!Object.values(p.dispo||{}).some(Boolean));
    if(!cibles.length){ alert('Tous les professeurs ont déjà au moins une disponibilité.'); return; }
    if(!confirm('Marquer '+cibles.length+' professeur(s) comme disponibles sur TOUS les créneaux ?\n\nTu pourras ensuite restreindre chaque professeur individuellement (bouton Modifier).')) return;
    cibles.forEach(p=>{ p.dispo={}; state.jours.forEach(j=>state.creneaux.forEach(cr=>{ p.dispo[j+'|'+cr]=true; })); });
    save(); renderMain();
  };
  const bOpenAll=document.createElement('button'); bOpenAll.className='btn small'; bOpenAll.textContent='Tous les professeurs totalement disponibles';
  bOpenAll.onclick=()=>{
    if(!state.profs.length){ alert('Aucun professeur enregistré pour le moment.'); return; }
    if(!confirm('Marquer les '+state.profs.length+' professeur(s) comme disponibles sur TOUS les créneaux, sans exception (y compris ceux déjà réglés individuellement) ?\n\nChaque professeur pourra ensuite être restreint manuellement, un par un, via « Modifier ».')) return;
    state.profs.forEach(p=>{ p.dispo={}; state.jours.forEach(j=>state.creneaux.forEach(cr=>{ p.dispo[j+'|'+cr]=true; })); });
    save(); renderMain();
  };
  tools.append(search,bOpenAll,bOpen); list.appendChild(tools);
  const listBody=document.createElement('div'); list.appendChild(listBody);
  function drawList(){
    const q=search.value.trim().toLowerCase();
    listBody.innerHTML='';
    const filtres=state.profs.filter(p=>!q || p.nom.toLowerCase().includes(q) || (p.matieres||[]).some(m=>m.toLowerCase().includes(q)));
    if(!filtres.length){ listBody.innerHTML='<p class="small">Aucun professeur trouvé.</p>'; return; }
    filtres.forEach(p=>{
      const div=document.createElement('div');
      div.style.borderTop='1px solid var(--line)'; div.style.padding='10px 0';
      div.style.display='flex'; div.style.gap='10px'; div.style.alignItems='flex-start';
      const nbDispo = Object.values(p.dispo||{}).filter(Boolean).length;
      const photoHtml = p.photo ? '<img src="'+p.photo+'" style="width:50px;height:50px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex-shrink:0;">' : '<div style="width:50px;height:50px;border-radius:8px;background:var(--bg);border:1px solid var(--line);flex-shrink:0;"></div>';
      const infosPerso = [p.age?p.age+' ans':null, p.lieuNaissance||null, p.telephone?'📞 '+p.telephone:null].filter(Boolean).join(' · ');
      const infoDiv = document.createElement('div'); infoDiv.style.flex='1';
      infoDiv.innerHTML = '<b>'+esc(p.nom)+'</b>'+(infosPerso?' <span class="small">('+esc(infosPerso)+')</span>':'')+' — '+esc((p.matieres||[]).join(', ')||'—')
        +'<br><span class="small">Écoles: '+esc((p.ecoles||[]).map(ecoleNom).join(', ')||'aucune')+' · '+nbDispo+' créneau(x) disponible(s)</span>'
        +(p.diplome?'<br><span class="small">🎓 '+esc(p.diplome)+'</span>':'');
      const btns=document.createElement('div'); btns.className='row'; btns.style.marginTop='6px';
      const bEdit=document.createElement('button'); bEdit.className='btn small'; bEdit.textContent='Modifier';
      bEdit.onclick=()=>openProfEditor(p.id);
      const bDel=document.createElement('button'); bDel.className='btn danger small'; bDel.textContent='Supprimer';
      bDel.onclick=()=>{
        const h=heuresPlaceesProf(p.id).length;
        if(!confirm('Supprimer '+p.nom+' ?'+(h?'\n\nAttention : '+h+' heure(s) sont placées à son nom dans les emplois du temps.':''))) return;
        state.profs = state.profs.filter(x=>x.id!==p.id); save(); renderMain();
      };
      btns.append(bEdit,bDel); infoDiv.appendChild(btns);
      div.innerHTML = photoHtml;
      div.appendChild(infoDiv);
      listBody.appendChild(div);
    });
  }
  search.oninput=()=>{ profSearch=search.value; drawList(); };
  drawList();
  app.appendChild(list);
}


function openProfEditor(profId){
  const p=state.profs.find(x=>x.id===profId); if(!p) return;
  const ov=document.getElementById('overlayBig'), body=document.getElementById('modalBig');
  const dispo=Object.assign({}, p.dispo||{});
  let photoData=p.photo||null;
  body.innerHTML='<h3>Modifier — '+esc(p.nom)+'</h3>'
    +'<label>Nom et prénoms</label><input type="text" id="ePNom">'
    +'<div class="row" style="margin-top:8px;"><input type="number" id="ePAge" placeholder="Âge" style="width:90px;"><input type="text" id="ePLieu" placeholder="Lieu de naissance" style="flex:1;min-width:140px;width:auto;"><input type="text" id="ePTel" placeholder="Téléphone" style="flex:1;min-width:140px;width:auto;"></div>'
    +'<label>Diplôme</label><input type="text" id="ePDiplome" placeholder="Ex: Doctorat">'
    +'<label>Photo</label><div class="row"><input type="file" id="ePPhoto" accept="image/*" style="width:auto;"><span id="ePPhotoPrev"></span></div>'
    +'<label>Écoles où il/elle intervient</label><div class="row" id="ePEcoles"></div>'
    +'<label>Matières enseignées</label><div id="ePMatieres" style="max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:4px 14px;"></div>'
    +'<label>Disponibilités <span class="small">(clique une case, un jour ou une heure pour basculer)</span></label>'
    +'<div class="row"><button type="button" class="btn ghost small" id="eAll">Tout cocher</button><button type="button" class="btn ghost small" id="eNone">Tout décocher</button></div>'
    +'<div class="gridwrap" style="margin:0;padding:0;"><div id="ePDispo"></div></div>'
    +'<div id="ePMsg"></div>'
    +'<div class="row" style="margin-top:12px;"><button class="btn" id="ePSave">Enregistrer</button><button class="btn ghost" id="ePCancel">Annuler</button></div>';
  body.querySelector('#ePNom').value=p.nom;
  body.querySelector('#ePAge').value=p.age||'';
  body.querySelector('#ePLieu').value=p.lieuNaissance||'';
  body.querySelector('#ePTel').value=p.telephone||'';
  body.querySelector('#ePDiplome').value=p.diplome||'';
  const prev=body.querySelector('#ePPhotoPrev');
  const showPhoto=()=>{ prev.innerHTML=photoData?'<img src="'+photoData+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">':''; };
  showPhoto();
  body.querySelector('#ePPhoto').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ photoData=r.result; showPhoto(); }; r.readAsDataURL(f);
  };
  const mkCheck=(container, value, label, checked)=>{
    const l=document.createElement('label'); l.style.cssText='display:inline-flex;gap:5px;align-items:center;margin:0;font-size:13px;color:var(--ink);';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.value=value; cb.checked=checked; cb.style.cssText='width:auto;min-height:0;';
    l.appendChild(cb); l.appendChild(document.createTextNode(label)); container.appendChild(l);
  };
  const eBox=body.querySelector('#ePEcoles');
  state.ecoles.forEach(s=>mkCheck(eBox, s.id, s.nom, (p.ecoles||[]).includes(s.id)));
  const mBox=body.querySelector('#ePMatieres');
  toutesMatieres(p.matieres).forEach(m=>mkCheck(mBox, m, m, (p.matieres||[]).includes(m)));
  const grid=body.querySelector('#ePDispo'); grid.className='availgrid';
  grid.style.gridTemplateColumns='92px repeat('+state.jours.length+',1fr)';
  function drawDispo(){
    grid.innerHTML='';
    grid.appendChild(document.createElement('div'));
    state.jours.forEach(j=>{
      const h=document.createElement('button'); h.type='button'; h.className='btn ghost small'; h.style.cssText='min-height:28px;padding:2px 4px;font-size:11px;'; h.textContent=j.slice(0,3); h.title='Basculer toute la journée';
      h.onclick=()=>{ const all=state.creneaux.every(c=>dispo[j+'|'+c]); state.creneaux.forEach(c=>{ if(all) delete dispo[j+'|'+c]; else dispo[j+'|'+c]=true; }); drawDispo(); };
      grid.appendChild(h);
    });
    state.creneaux.forEach(cren=>{
      const l=document.createElement('button'); l.type='button'; l.className='btn ghost small'; l.style.cssText='min-height:32px;padding:2px 4px;font-size:11px;'; l.textContent=cren; l.title='Basculer toute la ligne';
      l.onclick=()=>{ const all=state.jours.every(j=>dispo[j+'|'+cren]); state.jours.forEach(j=>{ if(all) delete dispo[j+'|'+cren]; else dispo[j+'|'+cren]=true; }); drawDispo(); };
      grid.appendChild(l);
      state.jours.forEach(j=>{
        const key=j+'|'+cren;
        const b=document.createElement('button'); b.type='button'; b.className='availchk'+(dispo[key]?' on':'');
        b.onclick=()=>{ if(dispo[key]) delete dispo[key]; else dispo[key]=true; b.classList.toggle('on',!!dispo[key]); };
        grid.appendChild(b);
      });
    });
  }
  drawDispo();
  body.querySelector('#eAll').onclick=()=>{ state.jours.forEach(j=>state.creneaux.forEach(c=>{ dispo[j+'|'+c]=true; })); drawDispo(); };
  body.querySelector('#eNone').onclick=()=>{ Object.keys(dispo).forEach(k=>delete dispo[k]); drawDispo(); };
  body.querySelector('#ePCancel').onclick=()=>ov.classList.remove('show');
  body.querySelector('#ePSave').onclick=()=>{
    const msg=body.querySelector('#ePMsg');
    const nom=body.querySelector('#ePNom').value.trim();
    if(!nom){ msg.innerHTML='<div class="msg err">Le nom est requis.</div>'; return; }
    const ecoles=[...eBox.querySelectorAll('input:checked')].map(i=>i.value);
    const matieres=[...mBox.querySelectorAll('input:checked')].map(i=>i.value);
    const placees=heuresPlaceesProf(p.id);
    const conflitsDispo=placees.length ? (function(){
      const res=[]; const d=cd();
      state.ecoles.forEach(s=>{ const e=d.emploi[s.id]||{}; Object.keys(e).forEach(cl=>{ Object.entries(e[cl]).forEach(([k,v])=>{ if(v.profId===p.id && !dispo[k]) res.push(k.replace('|',' ')+' — '+cl+' ('+ecoleNom(s.id)+')'); }); }); });
      return res;
    })() : [];
    if(conflitsDispo.length){
      msg.innerHTML='<div class="msg err">Impossible : ce professeur a déjà cours sur des créneaux que tu viens de fermer :<br>'+conflitsDispo.slice(0,6).map(esc).join('<br>')+(conflitsDispo.length>6?'<br>…':'')+'<br>Libère d\'abord ces heures, ou garde ces cases cochées.</div>'; return;
    }
    const ecolesRetirees=[...new Set(placees.filter(x=>!ecoles.includes(x.ecole)).map(x=>ecoleNom(x.ecole)))];
    if(ecolesRetirees.length){
      msg.innerHTML='<div class="msg err">Impossible : ce professeur a des heures placées dans '+esc(ecolesRetirees.join(', '))+'. Libère-les d\'abord ou garde cette école cochée.</div>'; return;
    }
    p.nom=nom; p.age=parseInt(body.querySelector('#ePAge').value)||null;
    p.lieuNaissance=body.querySelector('#ePLieu').value.trim(); p.telephone=body.querySelector('#ePTel').value.trim();
    p.diplome=body.querySelector('#ePDiplome').value.trim(); p.photo=photoData;
    p.ecoles=ecoles; p.matieres=matieres; p.dispo=dispo;
    save(); ov.classList.remove('show'); renderMain();
  };
  ov.classList.add('show');
}

function buildProfForm(){
  const wrap=document.createElement('div');
  wrap.innerHTML=`
    <div class="row"><input type="text" id="pNom" placeholder="Nom du professeur"></div>
    <div class="row">
      <input type="number" id="pAge" placeholder="Âge" style="width:90px;">
      <input type="text" id="pLieuNaissance" placeholder="Lieu de naissance">
      <input type="text" id="pTel" placeholder="Numéro de téléphone">
    </div>
    <label class="small">Photo (scan ou photo d'identité)</label>
    <div class="row"><input type="file" id="pPhoto" accept="image/*"></div>
    <div id="pPhotoPreview"></div>
    <label class="small">Diplôme obtenu (ex: Doctorat, Master, Licence, BTS...)</label>
    <div class="row"><input type="text" id="pDiplome" placeholder="Ex: Doctorat"></div>
    <label class="small">Matières enseignées</label>
    <div class="row" id="pMatieres"></div>
    <label class="small">Écoles où il/elle intervient</label>
    <div class="row" id="pEcoles"></div>
    <label class="small">Disponibilités (clique pour activer/désactiver — ou utilise le bouton pour tout basculer)</label>
    <div class="row"><button type="button" class="btn ghost small" id="pToggleAll">Rendre toutes les heures disponibles / indisponibles</button></div>
    <div class="gridwrap" style="margin:0;padding:0;"><div id="pDispoGrid"></div></div>
    <div class="row" style="margin-top:10px;"><button class="btn" id="pSave">Enregistrer le professeur</button></div>
    <div id="pMsg"></div>
  `;
  setTimeout(()=>{
    let photoData = null;
    const photoInput = wrap.querySelector('#pPhoto');
    const photoPrev = wrap.querySelector('#pPhotoPreview');
    photoInput.onchange = ()=>{
      const f = photoInput.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ photoData = r.result; photoPrev.innerHTML = `<img src="${photoData}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">`; };
      r.readAsDataURL(f);
    };
    const mDiv=wrap.querySelector('#pMatieres');
    toutesMatieres().forEach(m=>{
      const lbl=document.createElement('label'); lbl.style.fontSize='12px';
      lbl.innerHTML=`<input type="checkbox" value="${m}"> ${m}`;
      mDiv.appendChild(lbl);
    });
    const eDiv=wrap.querySelector('#pEcoles');
    state.ecoles.forEach(s=>{
      const lbl=document.createElement('label'); lbl.style.fontSize='12px';
      lbl.innerHTML=`<input type="checkbox" value="${s.id}"> ${s.nom}`;
      eDiv.appendChild(lbl);
    });
    const dispo={};
    const grid=wrap.querySelector('#pDispoGrid');
    function drawGridDispo(){
      grid.className='availgrid';
      grid.style.gridTemplateColumns = `70px repeat(${state.jours.length},1fr)`;
      grid.innerHTML = `<div></div>` + state.jours.map(j=>`<div class="h">${j}</div>`).join('');
      state.creneaux.forEach(cren=>{
        grid.innerHTML += `<div class="h" style="text-align:right;padding-right:4px;">${cren}</div>`;
        state.jours.forEach(j=>{
          const key=j+'|'+cren;
          grid.innerHTML += `<button type="button" class="availchk${dispo[key]?' on':''}" data-key="${key}"></button>`;
        });
      });
      grid.querySelectorAll('.availchk').forEach(btn=>{
        btn.onclick=()=>{ const k=btn.dataset.key; dispo[k]=!dispo[k]; btn.classList.toggle('on', !!dispo[k]); };
      });
    }
    drawGridDispo();
    wrap.querySelector('#pToggleAll').onclick=()=>{
      const toutesOuvertes = state.jours.every(j=>state.creneaux.every(cr=>dispo[j+'|'+cr]));
      Object.keys(dispo).forEach(k=>delete dispo[k]);
      if(!toutesOuvertes){ state.jours.forEach(j=>state.creneaux.forEach(cr=>{ dispo[j+'|'+cr]=true; })); }
      drawGridDispo();
    };
    wrap.querySelector('#pSave').onclick=()=>{
      const nom = wrap.querySelector('#pNom').value.trim();
      const age = parseInt(wrap.querySelector('#pAge').value) || null;
      const lieuNaissance = wrap.querySelector('#pLieuNaissance').value.trim();
      const telephone = wrap.querySelector('#pTel').value.trim();
      const diplome = wrap.querySelector('#pDiplome').value.trim();
      const matieres = [...wrap.querySelectorAll('#pMatieres input:checked')].map(i=>i.value);
      const ecoles = [...wrap.querySelectorAll('#pEcoles input:checked')].map(i=>i.value);
      const msg=wrap.querySelector('#pMsg');
      if(!nom || matieres.length===0 || ecoles.length===0){
        msg.innerHTML='<div class="msg err">Nom, au moins une matière et une école sont requis.</div>'; return;
      }
      state.profs.push({id:uid(), nom, age, lieuNaissance, telephone, photo:photoData, diplome, matieres, ecoles, dispo});
      save();
      msg.innerHTML='<div class="msg ok">Professeur ajouté ✓</div>';
      setTimeout(()=>renderMain(), 400);
    };
  },0);
  return wrap;
}

function renderBesoins(app){
  const d = cd();
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<h2>Ajouter un besoin horaire</h2><p class="small">Ex: "6ème A à Est Loko a besoin de 4h de Mathématiques par semaine". Année : ${state.anneeActuelle}</p>`;
  const anySchoolHasClasses = state.ecoles.some(s=>d.classes[s.id].length>0);
  if(!anySchoolHasClasses){
    c.innerHTML+=`<p class="small">Ajoute d'abord des classes dans Configuration.</p>`;
    app.appendChild(c); return;
  }
  const selE=document.createElement('select'); selE.id='bEcole';
  state.ecoles.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.nom; selE.appendChild(o); });
  const selC=document.createElement('select'); selC.id='bClasse';
  const selM=document.createElement('select'); selM.id='bMatiere';
  toutesMatieres().forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m; selM.appendChild(o); });
  const inpH=document.createElement('input'); inpH.type='number'; inpH.id='bHeures'; inpH.placeholder='Heures/semaine'; inpH.min=1; inpH.style.width='120px';
  const row=document.createElement('div'); row.className='row';
  row.append(selE, selC, selM, inpH);
  const bAdd=document.createElement('button'); bAdd.className='btn'; bAdd.textContent='Ajouter';
  row.appendChild(bAdd);
  c.appendChild(row);
  function refreshClasses(){
    selC.innerHTML='';
    (d.classes[selE.value]||[]).forEach(cl=>{ const o=document.createElement('option'); o.value=cl; o.textContent=cl; selC.appendChild(o); });
  }
  selE.onchange=refreshClasses; refreshClasses();
  bAdd.onclick=()=>{
    if(!selC.value || !inpH.value) return;
    d.besoins.push({ecole:selE.value, classe:selC.value, matiere:selM.value, heures:parseInt(inpH.value), profId:null});
    save(); renderMain();
  };
  app.appendChild(c);

  const list=document.createElement('div'); list.className='card';
  list.innerHTML=`<h2>Besoins enregistrés (${d.besoins.length})</h2><p class="small">Tu peux affecter ici un professeur par matière pour chaque classe — manuellement (menu déroulant) ou automatiquement (bouton). Cette affectation sert de préférence pour la génération auto et de suggestion par défaut en saisie manuelle.</p>`;
  state.ecoles.forEach(s=>{
    (d.classes[s.id]||[]).forEach(cl=>{
      const key=s.id+'|'+cl;
      const filId = d.classeFiliere[key];
      if(!filId) return;
      const fil = state.filieres.find(f=>f.id===filId);
      if(!fil) return;
      const box=document.createElement('div'); box.className='row';
      box.innerHTML=`<span class="small"><b>${cl}</b> (${s.nom}) → filière ${fil.code}</span>`;
      const bGen=document.createElement('button'); bGen.className='btn small'; bGen.textContent='Générer les besoins depuis la filière';
      bGen.onclick=()=>{
        fil.matieres.forEach(m=>{
          const exists = d.besoins.some(b=>b.ecole===s.id && b.classe===cl && b.matiere===m.nom);
          if(!exists) d.besoins.push({ecole:s.id, classe:cl, matiere:m.nom, heures:m.heures, profId:null});
        });
        save(); renderMain();
      };
      box.appendChild(bGen); list.appendChild(box);
    });
  });
  state.ecoles.forEach(s=>{
    const classesConcernees = [...new Set(d.besoins.filter(b=>b.ecole===s.id).map(b=>b.classe))];
    if(classesConcernees.length===0) return;
    const h=document.createElement('p'); h.innerHTML=`<b>${s.nom}</b>`; list.appendChild(h);
    classesConcernees.forEach(cl=>{
      const items = d.besoins.map((b,i)=>({...b,i})).filter(b=>b.ecole===s.id && b.classe===cl);
      const sub=document.createElement('div'); sub.style.marginBottom='10px'; sub.style.paddingLeft='8px'; sub.style.borderLeft='2px solid var(--line)';
      const rowH=document.createElement('div'); rowH.className='row';
      rowH.innerHTML=`<b class="small">${cl}</b>`;
      const bAuto=document.createElement('button'); bAuto.className='btn ghost small'; bAuto.textContent='Affecter automatiquement les manquants';
      bAuto.onclick=()=>{
        items.forEach(b=>{
          if(b.profId) return;
          const candidats = state.profs.filter(p=>p.matieres.includes(b.matiere) && p.ecoles.includes(s.id));
          if(candidats.length===0) return;
          const charge = p => d.besoins.filter(x=>x.profId===p.id).length;
          candidats.sort((a,b2)=>charge(a)-charge(b2) || a.nom.localeCompare(b2.nom));
          d.besoins[b.i].profId = candidats[0].id;
        });
        save(); renderMain();
      };
      rowH.appendChild(bAuto); sub.appendChild(rowH);
      items.forEach(b=>{
        const div=document.createElement('div'); div.className='row';
        div.innerHTML=`<span class="small">${b.matiere} : ${b.heures}h/semaine</span>`;
        const selP=document.createElement('select'); selP.style.fontSize='12px';
        const candidats = state.profs.filter(p=>p.matieres.includes(b.matiere) && p.ecoles.includes(s.id));
        selP.innerHTML = '<option value="">— non affecté —</option>' + candidats.map(p=>`<option value="${p.id}" ${b.profId===p.id?'selected':''}>${p.nom}</option>`).join('');
        if(candidats.length===0) selP.innerHTML = '<option value="">— aucun prof qualifié dans cette école —</option>';
        selP.onchange=()=>{ d.besoins[b.i].profId = selP.value || null; save(); };
        const del=document.createElement('button'); del.className='btn danger small'; del.textContent='✕';
        del.onclick=()=>{ d.besoins.splice(b.i,1); save(); renderMain(); };
        div.append(selP, del); sub.appendChild(div);
      });
      list.appendChild(sub);
    });
  });
  app.appendChild(list);
}

// ---------- FEUILLE D'EMPLOI DU TEMPS (en-tête + récapitulatifs) ----------
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function heuresPlaceesProf(profId){
  const d=cd(); const res=[];
  state.ecoles.forEach(s=>{
    const e=d.emploi[s.id]||{};
    Object.keys(e).forEach(cl=>{
      Object.values(e[cl]).forEach(v=>{ if(v.profId===profId) res.push({ecole:s.id, classe:cl, matiere:v.matiere}); });
    });
  });
  return res;
}

function computeProfSheet(profId){
  const prof=state.profs.find(p=>p.id===profId);
  const placees=heuresPlaceesProf(profId);
  const ecolesIds=[...new Set(placees.map(x=>x.ecole))];
  const ecolesLabel=(ecolesIds.length?ecolesIds:(prof.ecoles||[])).map(ecoleNom).join(' / ') || '—';
  const parMatiere={};
  placees.forEach(x=>{ parMatiere[x.matiere]=(parMatiere[x.matiere]||0)+1; });
  const parClasse={};
  placees.forEach(x=>{
    const k=x.classe+'|'+x.ecole;
    if(!parClasse[k]) parClasse[k]={classe:x.classe, ecole:x.ecole, h:0, mats:{}};
    parClasse[k].h++; parClasse[k].mats[x.matiere]=(parClasse[k].mats[x.matiere]||0)+1;
  });
  return {
    ecoleLabel:ecolesLabel, annee:state.anneeActuelle, titre:'EMPLOI DU TEMPS PROFESSEUR',
    photo:prof.photo||null,
    info:[['Nom et prénoms',prof.nom],['Matière(s)',(prof.matieres||[]).join(', ')||'—'],['Téléphone',prof.telephone||'—']],
    tables:[
      {titre:'Récapitulatif des heures (total : '+placees.length+' h)', headers:['Matière','Heures'], rows:Object.entries(parMatiere).map(([m,h])=>[m,h])},
      {titre:'Récapitulatif des classes', headers:['Classe','École','Matière(s)','Heures'], rows:Object.values(parClasse).map(c=>[c.classe, ecoleNom(c.ecole), Object.entries(c.mats).map(([m,h])=>m+' ('+h+'h)').join(', '), c.h])}
    ],
    cellText:(j,cren)=>{ const e=findProfEntry(profId,j,cren); return e?(e.matiere+' — '+e.classe+' ('+ecoleNom(e.ecole)+') '+(e.salle||'')).trim():''; }
  };
}

function computeClasseSheet(ecole, classe){
  const d=cd();
  const fil=state.filieres.find(f=>f.id===d.classeFiliere[ecole+'|'+classe]);
  const emploi=(d.emploi[ecole]&&d.emploi[ecole][classe])||{};
  const groupes={};
  Object.values(emploi).forEach(v=>{ const k=v.matiere+'|'+v.profId; if(!groupes[k]) groupes[k]={matiere:v.matiere, profId:v.profId, h:0}; groupes[k].h++; });
  const lignes=[]; const vues=new Set();
  Object.values(groupes).forEach(g=>{
    vues.add(g.matiere);
    const prof=state.profs.find(p=>p.id===g.profId);
    const def=fil?fil.matieres.find(m=>m.nom===g.matiere):null;
    lignes.push([g.matiere, prof?prof.nom:'?', (prof&&prof.telephone)||'—', def?(g.h+' / '+def.heures):String(g.h)]);
  });
  if(fil){
    fil.matieres.forEach(m=>{
      if(vues.has(m.nom)) return;
      const b=d.besoins.find(b=>b.ecole===ecole&&b.classe===classe&&b.matiere===m.nom&&b.profId);
      const prof=b?state.profs.find(p=>p.id===b.profId):null;
      lignes.push([m.nom, prof?(prof.nom+' (affecté)'):'non affecté', (prof&&prof.telephone)||'—', '0 / '+m.heures]);
    });
  }
  lignes.sort((a,b)=>a[0].localeCompare(b[0]));
  return {
    ecoleLabel:ecoleNom(ecole), annee:state.anneeActuelle, titre:'EMPLOI DU TEMPS CLASSE', photo:null,
    info:[['Classe',classe],['École',ecoleNom(ecole)],['Filière',fil?fil.code:'—']],
    tables:[{titre:'Professeurs, matières et heures (placées / prévues) — total placé : '+Object.keys(emploi).length+' h', headers:['Matière','Professeur','Téléphone','Heures'], rows:lignes}],
    cellText:(j,cren)=>{ const v=emploi[j+'|'+cren]; if(!v) return ''; const p=state.profs.find(p=>p.id===v.profId); return (v.matiere+' — '+(p?p.nom:'?')+' '+(v.salle||'')).trim(); }
  };
}

function sheetToAoa(data){
  const cols=state.creneaux.length+1;
  const pad=(arr)=>{ const r=arr.slice(); while(r.length<cols) r.push(''); return r; };
  const rows=[];
  const top=new Array(cols).fill(''); top[0]=data.ecoleLabel; top[cols-1]='Année scolaire : '+data.annee; rows.push(top);
  rows.push(pad([data.titre]));
  data.info.forEach(([k,v])=>rows.push(pad([k+' :', v])));
  rows.push(pad([]));
  rows.push(['', ...state.creneaux]);
  state.jours.forEach(j=>rows.push([j, ...state.creneaux.map(cren=>data.cellText(j,cren))]));
  data.tables.forEach(t=>{
    rows.push(pad([])); rows.push(pad([t.titre])); rows.push(pad(t.headers));
    if(!t.rows.length) rows.push(pad(['Aucune donnée pour le moment.']));
    t.rows.forEach(r=>rows.push(pad(r)));
  });
  rows.push(pad([])); rows.push(pad(['Édité le '+stampNow()]));
  return rows;
}

// ---------- EXPORT (PDF / Excel / JPEG) ----------
function safeName(s){ return String(s).replace(/[\\\/:*?"<>|]+/g,'').replace(/\s+/g,'_'); }
function exportExcel(data, filename){
  const ws=XLSX.utils.aoa_to_sheet(sheetToAoa(data));
  ws['!cols']=[{wch:38}, ...state.creneaux.map(()=>({wch:32}))];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Emploi du temps');
  XLSX.writeFile(wb, safeName(filename)+'.xlsx');
}
function captureSheet(el){
  const clone=el.cloneNode(true);
  clone.classList.add('capturing');
  const foot=clone.querySelector('.sh-foot'); if(foot) foot.textContent='Édité le '+stampNow();
  clone.style.position='fixed'; clone.style.left='-99999px'; clone.style.top='0'; clone.style.width='940px'; clone.style.maxWidth='none';
  clone.querySelectorAll('.gridwrap').forEach(w=>{ w.style.overflow='visible'; });
  document.body.appendChild(clone);
  return html2canvas(clone,{backgroundColor:'#ffffff', scale:2}).then(c=>{ clone.remove(); return c; }, err=>{ clone.remove(); throw err; });
}
function exportImage(el, filename){
  captureSheet(el).then(canvas=>{
    const link=document.createElement('a');
    link.download=safeName(filename)+'.jpg';
    link.href=canvas.toDataURL('image/jpeg', 0.92);
    link.click();
  });
}
function exportPdf(el, filename){
  captureSheet(el).then(canvas=>{
    const { jsPDF } = window.jspdf;
    const portrait = canvas.height/canvas.width > 0.75;
    const pdf=new jsPDF({orientation:portrait?'portrait':'landscape', unit:'pt', format:'a4'});
    const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
    const ratio=Math.min((pageW-40)/canvas.width, (pageH-40)/canvas.height);
    pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',(pageW-canvas.width*ratio)/2,20,canvas.width*ratio,canvas.height*ratio);
    pdf.save(safeName(filename)+'.pdf');
  });
}
function stampNow(){
  const n=new Date();
  return n.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})+' à '+n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function printSheet(sheetEl){
  const old=document.getElementById('printArea'); if(old) old.remove();
  const area=document.createElement('div'); area.id='printArea';
  const clone=sheetEl.cloneNode(true);
  const foot=clone.querySelector('.sh-foot'); if(foot) foot.textContent='Imprimé le '+stampNow();
  area.appendChild(clone);
  document.body.appendChild(area);
  document.body.classList.add('printing');
  const cleanup=()=>{ document.body.classList.remove('printing'); area.remove(); window.removeEventListener('afterprint',cleanup); };
  window.addEventListener('afterprint',cleanup);
  setTimeout(cleanup, 180000);
  window.print();
}
function buildExportBar(data, sheetEl, filenameBase){
  const bar=document.createElement('div'); bar.className='row'; bar.style.marginBottom='10px';
  const bPdf=document.createElement('button'); bPdf.className='btn ghost small'; bPdf.textContent='📄 PDF';
  bPdf.onclick=()=>exportPdf(sheetEl, filenameBase);
  const bXls=document.createElement('button'); bXls.className='btn ghost small'; bXls.textContent='📊 Excel';
  bXls.onclick=()=>exportExcel(data, filenameBase);
  const bJpg=document.createElement('button'); bJpg.className='btn ghost small'; bJpg.textContent='🖼️ JPEG';
  bJpg.onclick=()=>exportImage(sheetEl, filenameBase);
  const bPrint=document.createElement('button'); bPrint.className='btn small'; bPrint.textContent='🖨️ Imprimer';
  bPrint.onclick=()=>printSheet(sheetEl);
  bar.append(bPrint,bPdf,bXls,bJpg);
  return bar;
}

function classBusy(ecole, classe, jour, cren){
  const d=cd();
  return !!(d.emploi[ecole] && d.emploi[ecole][classe] && d.emploi[ecole][classe][jour+'|'+cren]);
}

function findProfEntry(profId, jour, cren){
  const d=cd();
  for(const s of state.ecoles){
    const e = d.emploi[s.id]||{};
    for(const cl in e){
      const v = e[cl][jour+'|'+cren];
      if(v && v.profId===profId) return {ecole:s.id, classe:cl, matiere:v.matiere, salle:v.salle};
    }
  }
  return null;
}

// ---------- VALIDATION DES RÈGLES DE GESTION ----------
// Bloque par défaut ; ne force jamais une action "impossible" sans confirmation explicite de l'utilisateur.
function attemptSave(ecole, classe, jour, cren, matiere, profId, salle){
  const d = cd();
  const key = jour+'|'+cren;
  const filId = d.classeFiliere[ecole+'|'+classe];
  const fil = state.filieres.find(f=>f.id===filId);

  // Règle stricte (non contournable) : la matière doit appartenir à la filière de la classe.
  if(fil && !fil.matieres.some(m=>m.nom===matiere)){
    alert(`Impossible : "${matiere}" ne fait pas partie des matières de la filière ${fil.code} de cette classe.`);
    return false;
  }

  const prof = state.profs.find(p=>p.id===profId);
  const overrides = []; // {ecole, classe} dont le créneau sera libéré si confirmation

  // Disponibilité déclarée du professeur
  if(prof && !prof.dispo[key]){
    alert(`Impossible : ${prof.nom} n'est pas disponible le ${jour} de ${cren}.\n\nModifie d'abord sa disponibilité (onglet Professeurs → Modifier, ou vue « Par professeur » → bouton « Modifier la disponibilité »).`);
    return false;
  }

  // Volume horaire de la matière dans la filière
  if(fil){
    const matiereDef = fil.matieres.find(m=>m.nom===matiere);
    if(matiereDef){
      const classeEmploi = (d.emploi[ecole] && d.emploi[ecole][classe]) || {};
      let total=1; // ce nouveau créneau
      Object.entries(classeEmploi).forEach(([k,v])=>{ if(k!==key && v.matiere===matiere) total++; });
      if(total > matiereDef.heures){
        if(!confirm(`La filière ${fil.code} prévoit ${matiereDef.heures}h/semaine pour "${matiere}", et ce serait la ${total}e heure programmée pour ${classe}. Confirmer le dépassement ?`)) return false;
      }
    }
  }

  // Une seule et même matière = un seul professeur pour cette classe
  {
    const classeEmploi = (d.emploi[ecole] && d.emploi[ecole][classe]) || {};
    for(const k in classeEmploi){
      if(k===key) continue;
      const v = classeEmploi[k];
      if(v.matiere===matiere && v.profId && v.profId!==profId){
        const autre = state.profs.find(p=>p.id===v.profId);
        if(!confirm(`"${matiere}" pour ${classe} est déjà assuré par ${autre?autre.nom:'un autre professeur'} à un autre créneau. Confirmer un second professeur pour cette même matière ?`)) return false;
        break;
      }
    }
  }

  // Le professeur ne peut être à 2 endroits à la fois
  const conflitProf = profBusy(profId, jour, cren, ecole, classe);
  if(conflitProf){
    if(!confirm(`Ce professeur est déjà programmé pour ${conflitProf.classe} (${ecoleNom(conflitProf.ecole)}) à cet horaire. Retirer cette heure-là pour l'assigner ici à la place ?`)) return false;
    overrides.push(conflitProf);
  }

  // Une salle ne peut accueillir 2 classes en même temps
  const conflitSalleClasse = salleBusy(ecole, salle, jour, cren, classe);
  if(conflitSalleClasse && !overrides.some(o=>o.ecole===ecole && o.classe===conflitSalleClasse)){
    if(!confirm(`Cette salle est déjà occupée par ${conflitSalleClasse} à cet horaire. Retirer cette heure-là pour libérer la salle ?`)) return false;
    overrides.push({ecole, classe:conflitSalleClasse});
  }

  overrides.forEach(o=>{ if(d.emploi[o.ecole] && d.emploi[o.ecole][o.classe]) delete d.emploi[o.ecole][o.classe][key]; });
  if(!d.emploi[ecole][classe]) d.emploi[ecole][classe]={};
  d.emploi[ecole][classe][key] = {matiere, profId, salle};
  save();
  return true;
}

function openProfCellEditor(profId, jour, cren){
  const d = cd();
  const prof = state.profs.find(p=>p.id===profId);
  const overlay=document.getElementById('overlay');
  const body=document.getElementById('modalBody');
  const existing = findProfEntry(profId, jour, cren);
  body.innerHTML = `<h3>${prof.nom} — ${jour} ${cren}</h3>
    <label>École</label><select id="peEcole"></select>
    <label>Classe</label><select id="peClasse"></select>
    <label>Matière</label><select id="peMatiere"></select>
    <label>Salle</label><select id="peSalle"></select>
    <div id="peMsg"></div>
    <div class="row" style="margin-top:12px;">
      <button class="btn" id="peSave">Enregistrer</button>
      ${existing?'<button class="btn danger" id="peDel">Libérer le créneau</button>':''}
      <button class="btn ghost" id="peCancel">Annuler</button>
    </div>`;
  const selE=body.querySelector('#peEcole'), selC=body.querySelector('#peClasse'), selM=body.querySelector('#peMatiere'), selS=body.querySelector('#peSalle');
  const ecolesProf = state.ecoles.filter(s=>prof.ecoles.includes(s.id));
  if(ecolesProf.length===0){ body.querySelector('#peMsg').innerHTML='<div class="msg err">Ce professeur n\'est rattaché à aucune école.</div>'; overlay.classList.add('show'); body.querySelector('#peCancel').onclick=()=>overlay.classList.remove('show'); return; }
  selE.innerHTML = ecolesProf.map(s=>`<option value="${s.id}">${s.nom}</option>`).join('');
  if(existing) selE.value = existing.ecole;
  function classesCompatibles(ecoleId){
    return (d.classes[ecoleId]||[]).filter(cl=>{
      const filId = d.classeFiliere[ecoleId+'|'+cl];
      const fil = state.filieres.find(f=>f.id===filId);
      if(!fil) return false;
      return fil.matieres.some(m=>prof.matieres.includes(m.nom));
    });
  }
  function refreshClasse(){
    const ecoleId = selE.value;
    const compat = classesCompatibles(ecoleId);
    selC.innerHTML = compat.length ? compat.map(cl=>{
      const busy = classBusy(ecoleId, cl, jour, cren) && !(existing && existing.ecole===ecoleId && existing.classe===cl);
      return `<option value="${cl}">${cl}${busy?' (déjà occupée à cette heure)':''}</option>`;
    }).join('') : '<option value="">Aucune classe compatible</option>';
    if(existing && existing.ecole===ecoleId) selC.value = existing.classe;
    refreshMatiere();
  }
  function refreshMatiere(){
    const ecoleId=selE.value, classe=selC.value;
    const filId = d.classeFiliere[ecoleId+'|'+classe];
    const fil = state.filieres.find(f=>f.id===filId);
    const options = fil ? fil.matieres.filter(m=>prof.matieres.includes(m.nom)).map(m=>m.nom) : [];
    selM.innerHTML = options.map(m=>`<option value="${m}">${m}</option>`).join('') || '<option value="">—</option>';
    if(existing) selM.value = existing.matiere;
    refreshSalle();
  }
  function refreshSalle(){
    const ecoleId = selE.value;
    selS.innerHTML='<option value="">— choisir —</option>'+nomsSalles(ecoleId).map(s=>{
      const occ = salleBusy(ecoleId, s, jour, cren, selC.value);
      return `<option value="${s}">${s}${occ?' (occupée à cette heure)':''}</option>`;
    }).join('');
    if(existing) selS.value = existing.salle;
  }
  selE.onchange=refreshClasse;
  selC.onchange=refreshMatiere;
  refreshClasse();
  body.querySelector('#peSave').onclick=()=>{
    const msg=body.querySelector('#peMsg');
    if(!selE.value||!selC.value||!selM.value||!selS.value){ msg.innerHTML='<div class="msg err">Remplis tous les champs.</div>'; return; }
    if(existing && (existing.ecole!==selE.value || existing.classe!==selC.value)){
      delete d.emploi[existing.ecole][existing.classe][jour+'|'+cren];
    }
    const ok = attemptSave(selE.value, selC.value, jour, cren, selM.value, profId, selS.value);
    if(!ok) return;
    overlay.classList.remove('show'); window.__drawProfGrid && window.__drawProfGrid();
  };
  const delBtn=body.querySelector('#peDel');
  if(delBtn) delBtn.onclick=()=>{
    delete d.emploi[existing.ecole][existing.classe][jour+'|'+cren];
    save(); overlay.classList.remove('show'); window.__drawProfGrid && window.__drawProfGrid();
  };
  body.querySelector('#peCancel').onclick=()=>overlay.classList.remove('show');
  overlay.classList.add('show');
}

function renderEDT_classe(app){
  const d = cd();
  const nav=document.createElement('div'); nav.className='card';
  nav.innerHTML='<h2>Choisir une classe</h2><p class="small">Les classes viennent de l\'onglet Configuration — toute classe ajoutée, retirée ou dont la filière change y apparaît aussitôt ici, et vice versa.</p>';
  app.appendChild(nav);

  const gridCard=document.createElement('div'); gridCard.className='card'; gridCard.id='gridCard';
  app.appendChild(gridCard);

  // Si la dernière classe choisie n'existe plus, on oublie le choix
  if(lastEdtEcole && lastEdtClasse && !(d.classes[lastEdtEcole]||[]).includes(lastEdtClasse)){
    lastEdtEcole=null; lastEdtClasse=null;
  }

  function selectClasse(ecoleId, classe){
    lastEdtEcole=ecoleId; lastEdtClasse=classe;
    renderMain();
  }

  state.ecoles.forEach(s=>{
    const bloc=document.createElement('div'); bloc.style.marginBottom='10px';
    const titre=document.createElement('div'); titre.innerHTML=`<b>${esc(s.nom)}</b> <span class="small">(${s.zone||''})</span>`;
    bloc.appendChild(titre);
    const classes=d.classes[s.id]||[];
    if(!classes.length){
      const vide=document.createElement('p'); vide.className='small'; vide.textContent='Aucune classe créée pour cette école (Configuration → Classes).';
      bloc.appendChild(vide);
    } else {
      const wrap=document.createElement('div'); wrap.className='row'; wrap.style.marginTop='6px';
      classes.forEach(cl=>{
        const estActive = lastEdtEcole===s.id && lastEdtClasse===cl;
        const b=document.createElement('button');
        b.className = estActive ? 'btn small' : 'btn ghost small';
        b.textContent = cl;
        b.onclick=()=>selectClasse(s.id, cl);
        wrap.appendChild(b);
      });
      bloc.appendChild(wrap);
    }
    nav.appendChild(bloc);
  });

  if(!lastEdtEcole || !lastEdtClasse){
    gridCard.innerHTML='<p class="small">Clique sur une classe ci-dessus pour afficher et modifier son emploi du temps.</p>';
    return;
  }
  const ecole=lastEdtEcole, classe=lastEdtClasse;

  function drawGrid(){
    gridCard.innerHTML='';
    if(!d.emploi[ecole][classe]) d.emploi[ecole][classe]={};
    const table=document.createElement('table'); table.className='grid';
    let thead='<tr><th></th>'+state.creneaux.map(cren=>`<th>${cren}</th>`).join('')+'</tr>';
    let rows='';
    state.jours.forEach(j=>{
      rows+=`<tr><td class="slot">${j}</td>`;
      state.creneaux.forEach(cren=>{
        const key=j+'|'+cren;
        const v = d.emploi[ecole][classe][key];
        if(v){
          const prof=state.profs.find(p=>p.id===v.profId);
          rows+=`<td class="cell busy" data-jour="${j}" data-cren="${cren}"><b>${v.matiere}</b>${prof?prof.nom:'?'}<br><span class="small">${v.salle||''}</span></td>`;
        } else {
          rows+=`<td class="cell" data-jour="${j}" data-cren="${cren}"></td>`;
        }
      });
      rows+='</tr>';
    });
    table.innerHTML = thead+rows;
    table.querySelectorAll('.cell').forEach(td=>{
      td.onclick=()=>openCellEditor(ecole, classe, td.dataset.jour, td.dataset.cren);
    });
    const data = computeClasseSheet(ecole, classe);
    const wrap=document.createElement('div'); wrap.className='gridwrap'; wrap.appendChild(table);
    const sheet = renderSheetHtml(data, wrap);
    gridCard.appendChild(buildExportBar(data, sheet, `EDT_${classe}_${ecoleNom(ecole)}_${state.anneeActuelle}`));
    gridCard.appendChild(sheet);
  }
  window.__drawGrid = drawGrid;
  drawGrid();
}

    });

      sSel.appendChild(o);

  }
  mSel.onchange=refreshProfs; refreshProfs(); refreshSalles();
  body.querySelector('#mSave').onclick=()=>{
    const msg=body.querySelector('#mMsg');

  };

  if(delBtn) delBtn.onclick=()=>{ delete d.emploi[ecole][classe][jour+'|'+cren]; save(); overlay.classList.remove('show'); window.__drawGrid && window.__drawGrid(); };
  body.querySelector('#mCancel').onclick=()=>overlay.classList.remove('show');
  overlay.classList.add('show');
}

function generateAuto(){
  const d = cd();
  let placees=0; const echecs=[];
  // ordonner besoins : les plus contraints (moins de profs possibles) en premier
  const besoins = [...d.besoins].sort((a,b)=>{
    const na = state.profs.filter(p=>p.matieres.includes(a.matiere)&&p.ecoles.includes(a.ecole)).length;
    const nb = state.profs.filter(p=>p.matieres.includes(b.matiere)&&p.ecoles.includes(b.ecole)).length;
    return na-nb;
  });
  besoins.forEach(b=>{
    if(!d.emploi[b.ecole][b.classe]) d.emploi[b.ecole][b.classe]={};
    const emploiClasse = d.emploi[b.ecole][b.classe];
    let dejaPlacees = Object.values(emploiClasse).filter(v=>v.matiere===b.matiere).length;
    let aPlacer = b.heures - dejaPlacees;
    const candidatsProfs = b.profId
      ? state.profs.filter(p=>p.id===b.profId)
      : state.profs.filter(p=>p.matieres.includes(b.matiere) && p.ecoles.includes(b.ecole));
    outer:
    for(const jour of state.jours){
      for(const cren of state.creneaux){
        if(aPlacer<=0) break outer;
        const key=jour+'|'+cren;
        if(emploiClasse[key]) continue; // créneau déjà pris pour cette classe
        for(const prof of candidatsProfs){
          if(!prof.dispo[key]) continue;
          if(profBusy(prof.id, jour, cren, b.ecole, b.classe)) continue;
          const salleLibre = state.salles[b.ecole].filter(s=>!s.exclureAuto).map(s=>s.nom).find(nom=>!salleBusy(b.ecole, nom, jour, cren, b.classe));
          if(!salleLibre) continue;
          emploiClasse[key] = {matiere:b.matiere, profId:prof.id, salle:salleLibre};
          placees++; aPlacer--;
          break;
        }
      }
    }
    if(aPlacer>0) echecs.push({ecole:b.ecole, classe:b.classe, matiere:b.matiere, manque:aPlacer});
  });
  return {placees, echecs};
}

// ---------- ÉCRAN DE CONNEXION ----------
function showAuthScreen(){
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('tabs').style.display='none';
  document.getElementById('anneeBar').style.display='none';
  document.getElementById('app').style.display='none';
  const lb=document.getElementById('logoutBtn'); if(lb) lb.style.display='none';
}
let __appStarted=false;
function startApp(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('tabs').style.display='';
  document.getElementById('anneeBar').style.display='';
  document.getElementById('app').style.display='';
  const lb=document.getElementById('logoutBtn'); if(lb) lb.style.display='';
  renderTabs();
  renderAnneeBar();
  renderMain();
  if(__appStarted) return;
  __appStarted=true;
  if(fbReady){
    setSyncStatus('cours');
    const docRef = fbDb.collection('edt').doc('etat');
    function applyRemote(parsed){
      fbApplyingRemote=true;
      state=parsed;
      try{ localStorage.setItem('edt_v1', JSON.stringify(state)); localStorage.setItem('edt_v1_ts', String(Date.now())); }catch(e){}
      renderTabs(); renderAnneeBar(); renderMain();
      fbApplyingRemote=false;
    }
    function attachLiveListener(){
      docRef.onSnapshot(doc=>{
        if(!doc.exists) return;
        const remote=doc.data();
        if(!remote || !remote.data) return;
        let parsed;
        try{ parsed=JSON.parse(remote.data); }catch(e){ return; }
        applyRemote(parsed);
        setSyncStatus('ok');
      }, err=>{ console.warn('Synchronisation en ligne indisponible', err); setSyncStatus('erreur'); });
    }
    // Réconciliation unique au démarrage : on compare les horodatages pour savoir qui, du
    // local (ce qui vient d'être modifié avant même la connexion au cloud) ou du distant,
    // est le plus récent — jamais d'écrasement silencieux d'un travail local non encore envoyé.
    let localTs=0; try{ localTs=parseInt(localStorage.getItem('edt_v1_ts'))||0; }catch(e){}
    docRef.get().then(doc=>{
      if(!doc.exists){
        docRef.set({data:JSON.stringify(state), maj:firebase.firestore.FieldValue.serverTimestamp()})
          .then(()=>setSyncStatus('ok')).catch(e=>{ console.warn('Amorçage en ligne échoué', e); setSyncStatus('erreur'); });
        attachLiveListener();
        return;
      }
      const remote=doc.data();
      const remoteTs = (remote && remote.maj && remote.maj.toMillis) ? remote.maj.toMillis() : 0;
      if(remoteTs > localTs && remote && remote.data){
        let parsed=null; try{ parsed=JSON.parse(remote.data); }catch(e){}
        if(parsed) applyRemote(parsed);
        setSyncStatus('ok');
      } else {
        docRef.set({data:JSON.stringify(state), maj:firebase.firestore.FieldValue.serverTimestamp()})
          .then(()=>setSyncStatus('ok')).catch(e=>{ console.warn('Sauvegarde en ligne échouée', e); setSyncStatus('erreur'); });
      }
      attachLiveListener();
    }).catch(err=>{
      console.warn('Lecture initiale en ligne impossible', err);
      setSyncStatus('erreur');
      attachLiveListener();
    });
  }
}

if(fbReady && fbAuth){
  const authGo=document.getElementById('authGo');
  const authToggle=document.getElementById('authToggle');
  const authMsg=document.getElementById('authMsg');
  const authTitle=document.getElementById('authTitle');
  const authSkip=document.getElementById('authSkip');
  authSkip.onclick=()=>{ fbReady=false; startApp(); };
  let mode='login';
  authToggle.onclick=()=>{
    mode = mode==='login' ? 'signup' : 'login';
    authTitle.textContent = mode==='login' ? '🔒 Connexion' : '🔒 Créer un compte';
    authGo.textContent = mode==='login' ? 'Se connecter' : 'Créer le compte';
    authToggle.textContent = mode==='login' ? 'Créer un compte' : "J'ai déjà un compte";
    authMsg.innerHTML='';
  };
  authGo.onclick=()=>{
    const email=document.getElementById('authEmail').value.trim();
    const pass=document.getElementById('authPass').value;
    if(!email || !pass){ authMsg.innerHTML='<div class="msg err">Remplis les deux champs.</div>'; return; }
    authMsg.innerHTML='<div class="msg">Connexion…</div>';
    const action = mode==='login' ? fbAuth.signInWithEmailAndPassword(email,pass) : fbAuth.createUserWithEmailAndPassword(email,pass);
    action.catch(err=>{
      let m = err.message;
      if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential') m="Mot de passe incorrect.";
      if(err.code==='auth/user-not-found') m="Aucun compte avec cet e-mail — clique sur « Créer un compte ».";
      if(err.code==='auth/email-already-in-use') m="Un compte existe déjà avec cet e-mail — connecte-toi plutôt.";
      if(err.code==='auth/weak-password') m="Mot de passe trop court (6 caractères minimum).";
      if(err.code==='auth/invalid-email') m="Adresse e-mail invalide.";
      if(err.code==='auth/network-request-failed') m="Impossible de joindre le serveur depuis cet hébergement. Utilise « Continuer sans connexion » ci-dessous en attendant la bascule vers un hébergement externe.";
      authMsg.innerHTML='<div class="msg err">'+esc(m)+'</div>';
    });
  };
  fbAuth.onAuthStateChanged(user=>{ if(user) startApp(); else showAuthScreen(); });
} else {
  startApp();
}
